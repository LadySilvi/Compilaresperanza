<script>
window.addEventListener('load', function() {
    function actualizarTodo() {
        const ahora = new Date();
        const diaReal = ahora.getDate(); // Esto detecta que hoy es 3

        // --- RELOJ ---
        const elReloj = document.getElementById('reloj');
        if (elReloj) {
            elReloj.textContent = ahora.toLocaleTimeString('en-US', { 
                hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true 
            }).toLowerCase();
        }

        // --- CALENDARIO DINÁMICO ---
        // Buscamos todos los números dentro de tu div 'nomeron-dias'
        const dias = document.querySelectorAll('.nomeron-dias span');
        
        dias.forEach(span => {
            // Quitamos el diseño de "hoy" a todos primero
            span.style.backgroundColor = "transparent";
            span.style.color = "black";
            span.style.borderRadius = "0";
            span.style.fontWeight = "normal";

            // Si el número del span coincide con el día real (3)
            if (parseInt(span.textContent) === diaReal) {
                span.style.backgroundColor = "#ffc0cb"; // Rosa de Compilar Esperanza
                span.style.color = "white";
                span.style.borderRadius = "50%";
                span.style.fontWeight = "bold";
                span.style.display = "inline-block";
                span.style.width = "20px";
                span.style.textAlign = "center";
            }
        });
    }

    // Se actualiza cada segundo para que el cambio de día sea automático
    setInterval(actualizarTodo, 1000);
    actualizarTodo();
});
</script>
